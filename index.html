<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f2f3"><meta name="description" content="나만의 독서 아카이브, 오늘 뭐 읽었어?"><link rel="icon" type="image/png" href="book-icon.png"><link rel="apple-touch-icon" href="book-icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>오늘 뭐 읽었어?</title>
</head>
<body>
<div class="app-shell">
<header class="topbar"><div><span class="eyebrow">MY READING ARCHIVE</span><h1><span class="title-book-icon" aria-hidden="true"></span><span class="title-text">오늘 뭐 읽었어?</span><span class="sparkle">✳</span></h1></div></header>
<nav class="tabs"><button class="tab active" data-view="calendar">달력</button><button class="tab" data-view="stats">통계</button><button class="tab" data-view="library">작품 서랍</button><button class="tab" data-view="settings">설정</button></nav>
<main id="main"></main>
<footer class="quote-footer"><div class="quote-copy"><p class="quote-ko">“책은 책 이상이다. 차라리 그것은 삶 그 자체이다.”</p><p class="quote-en">“For books are more than books, they are the life.”</p><span class="quote-author">에이미 로웰 Amy Lowell</span></div></footer>
</div>
<input id="coverInput" type="file" accept="image/*" hidden><input id="restoreInput" type="file" accept="application/json,.json" hidden>
<dialog id="modal"><form method="dialog" class="modal-card"><button class="close" value="cancel" aria-label="닫기">×</button><div id="modalContent"></div></form></dialog>
<script src="app.js"></script>
</body></html>
